      │  │              Parser (自适应解析器)               │      │
      │  │    • CSS/XPath 选择器                          │      │
      │  │    • 智能元素追踪 (页面变化适应)                  │      │
      │  │    • 相似元素查找                               │      │
      │  └───────────────────────────────────────────────┘      │
