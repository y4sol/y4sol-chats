  content: "# \U0001F577️ Scrapling 深度分析\n\n## 1. 核心定位\n\n**自适应 Web Scraping 框架**\
    \ — 从单次请求到全规模爬取一体化解决方案。\n\n- **类型**: 企业级爬虫框架\n- **特点**: 智能页面变化适应 + 反爬虫绕过 + 完整爬虫架构\n\
    - **⭐ 评分**: ⭐⭐⭐⭐⭐ (27.9k Stars, 2k+ Forks)\n\n---\n\n## 2. 架构 (文本流程图)\n\n```\n\
    用户代码\n    ↓\n┌─────────────────────────────────────────────────────────┐\n│  \
    \                  Scrapling 框架                        │\n├─────────────────────────────────────────────────────────┤\n\
    │  ┌─────────────┐  ┌─────────────┐  ┌─────────────┐    │\n│  │   Fetcher   │\
    \  │   Spider    │  │    MCP      │    │\n│  │  (HTTP)     │  │  (爬虫)      │ \
    \ │  Server     │    │\n│  └──────┬──────┘  └──────┬──────┘  └──────┬──────┘ \
    \   │\n│         │                │                │             │\n│  ┌──────┴──────┐\
    \  ┌──────┴──────┐         │             │\n│  │ Stealthy    │  │  Scheduler \
    \ │         │             │\n│  │ Dynamic     │  │  Engine     │         │   \
    \          │\n│  └──────┬──────┘  └──────┬──────┘         │             │\n│ \
    \        │                │                │             │\n│  ┌──────┴────────────────┴────────────────┴──────┐\
    \      │\n│  │              Parser (自适应解析器)               │      │\n│  │    •\
    \ CSS/XPath 选择器                          │      │\n│  │    • 智能元素追踪 (页面变化适应) \
    \                 │      │\n│  │    • 相似元素查找                               │ \
    \     │\n│  └───────────────────────────────────────────────┘      │\n└─────────────────────────────────────────────────────────┘\n\
    \         ↓              ↓              ↓\n   HTTP/3 请求    Playwright     AI Agent\n\
    \   TLS指纹伪装   浏览器自动化    (Claude/Cursor)\n```\n\n---\n\n## 3. 技术栈\n\n| 模块 | 技术\
    \ |\n|------|------|\n| **HTTP 请求** | `requests` + TLS 指纹伪装 + HTTP/3 |\n| **浏览器**\
    \ | Playwright (Chromium) + Chrome |\n| **反爬绕过** | Cloudflare Turnstile/Interstitial\
    \ |\n| **异步** | `asyncio` |\n| **代理轮换** | 内置 `ProxyRotator` |\n| **AI 集成** | MCP\
    \ Server (Claude/Cursor) |\n| **爬虫架构** | 类 Scrapy 设计 |\n| **序列化** | 自研 Fast JSON\
    \ (比标准库快 10x) |\n\n---\n\n## 4. 使用方式\n\n### 快速开始 (单次请求)\n```python\nfrom scrapling.fetchers\
    \ import StealthyFetcher\n\n# 绕过 Cloudflare + 自动元素追踪\nStealthyFetcher.adaptive\
    \ = True\np = StealthyFetcher.fetch('https://example.com', headless=True, network_idle=True)\n\
    \n# 自适应选择器 - 网站改版也能找到\nproducts = p.css('.product', adaptive=True)\n```\n\n###\
    \ 完整爬虫\n```python\nfrom scrapling.spiders import Spider, Response\n\nclass MySpider(Spider):\n\
    \    name = \"demo\"\n    start_urls = [\"https://example.com/\"]\n    \n    async\
    \ def parse(self, response: Response):\n        for item in response.css('.product'):\n\
    \            yield {\"title\": item.css('h2::text').get()}\n\n# 启动爬虫 (支持流式输出、暂停恢复)\n\
    MySpider().start()\n```\n\n### CLI 用法\n```bash\n# 无需写代码，直接命令行爬取\nscrapling https://example.com\
    \ -s \".title::text\"\n```\n\n### MCP Server (AI Agent 用)\n```bash\n# 启动 MCP Server\n\
    uvx scrapling mcp\n```\n\n---\n\n## 5. 核心机制\n\n### \U0001F504 自适应解析 (Adaptive\
    \ Parsing)\n- **智能元素追踪**: 记录元素特征 (文本、结构、位置)\n- **页面变化适应**: 网站改版后自动重新定位元素\n- **相似元素查找**:\
    \ 找到的元素可用于发现更多相似元素\n\n### \U0001F6E1️ 反爬虫绕过\n- **TLS 指纹**: 模拟真实浏览器 TLS 握手\n- **Header\
    \ 伪装**: 自动生成真实浏览器 Header\n- **Cloudflare Turnstile**: 内置绕过 (无需手动解验证码)\n- **Playwright\
    \ 浏览器**: 完全自动化浏览器指纹\n\n### \U0001F577️ 爬虫框架\n- **并发控制**: 可配置并发数、域名限速、下载延迟\n- **多会话**:\
    \ 统一接口管理 HTTP + 浏览器会话\n- **暂停/恢复**: Checkpoint 机制，Ctrl+C 优雅关机\n- **流式输出**: `async\
    \ for item in spider.stream()` 实时推送\n\n### \U0001F500 代理轮换\n- 内置 `ProxyRotator`\
    \ \n- 支持循环/自定义策略\n- 支持单请求代理覆盖\n\n---\n\n## 6. 外部集成\n\n| 集成 | 用途 |\n|------|------|\n\
    | **MCP Server** | AI Agent (Claude/Cursor) 调用 |\n| **Playwright** | 动态页面渲染 |\n\
    | **代理服务商** | DataImpulse, BirdProxies, Evomi, Decodo |\n| **反爬 API** | Hyper\
    \ Solutions (Akamai/DataDome/Kasada) |\n| **CLI** | 终端直接爬取 |\n| **IPython Shell**\
    \ | 交互式调试 + curl 转代码 |\n\n---\n\n## 7. 优缺点对比\n\n| 维度 | 优点 | 缺点 |\n|------|------|------|\n\
    | **易用性** | API 简洁，文档丰富 | 功能太多，学习曲线略陡 |\n| **反爬能力** | 开箱即用 Cloudflare 绕过 | 复杂反爬仍需企业级方案\
    \ |\n| **性能** | Fast JSON 快 10x，内存优化 | 大量并发仍需优化 |\n| **稳定性** | 92% 测试覆盖，类型提示完整\
    \ | 依赖 Playwright，体积较大 |\n| **扩展性** | MCP + Spider Hooks 丰富 | 插件生态较弱 |\n| **社区**\
    \ | 27k Stars，活跃开发 | 中文资料较少 |\n\n---\n\n## 8. 对比同类工具\n\n| 工具 | 类型 | 反爬 | 难度 |\
    \ 适合场景 |\n|------|------|------|------|----------|\n| **Scrapling** | 框架 | ⭐⭐⭐⭐\
    \ | 中 | 企业级爬虫 + AI 集成 |\n| **Playwright** | 工具库 | ⭐⭐ | 低 | 简单动态页面 |\n| **Scrapy**\
    \ | 框架 | ⭐⭐ | 高 | 大型爬虫项目 |\n| **Selenium** | 工具库 | ⭐ | 低 | 简单自动化测试 |\n| **Puppeteer**\
    \ | 工具库 | ⭐⭐ | 中 | Node.js 项目 |\n\n---\n\n## 总结\n\nScrapling 是一个 **功能完备的企业级爬虫框架**，核心亮点：\n\
    \n1. **自适应解析** — 解决网站改版痛点\n2. **开箱即用的反爬** — Cloudflare Turnstile 绕过\n3. **完整爬虫架构**\
    \ — 暂停恢复、流式输出、代理轮换\n4. **AI 集成** — MCP Server 支持 Claude/Cursor\n\n适合需要 **稳定爬取\
    \ + 长期维护** 的项目。复杂度高于 Playwright，但长期维护成本更低。"
