      ---
      
      ### 漏洞根因
      
      **文件**: `packages/next/src/server/lib/router-server.ts`
      
      **脆弱代码** (v15.5.15, 约第 827-835 行):
      
      ```typescript
      const { matchedOutput, parsedUrl } = await resolveRoutes({
        req,
        res,
        isUpgradeReq: true,
        signal: signalFromNodeResponse(socket),
      })
      
      // TODO: allow upgrade requests to pages/app paths?
      // this was not previously supported
      if (matchedOutput) {
        return socket.end()
      }
      
      if (parsedUrl.protocol) {                          // ← 漏洞点
        return await proxyRequest(req, socket, parsedUrl, head)
      }
      ```
      
      **问题**: WebSocket Upgrade 请求处理分支在调用 `resolveRoutes()` 时，只解构了 `matchedOutput` 和 `parsedUrl`，**忽略了 `finished` 和 `statusCode`**。当攻击者发送带**绝对 URL** 的 WebSocket Upgrade 请求时：
      
      1. `resolveRoutes()` 解析出绝对 URL
      2. `parsedUrl.protocol` 为真（如 `http:`）
      3. 代码**直接无条件调用** `proxyRequest()` → 代理请求到任意目标
      
      **修复代码** (v15.5.16):
      
      ```typescript
      const { finished, matchedOutput, parsedUrl, statusCode } =
        await resolveRoutes({
          req,
          res,
          isUpgradeReq: true,
          signal: signalFromNodeResponse(socket),
        })
      
      if (matchedOutput) {
        return socket.end()
      }
      
      if (finished && parsedUrl.protocol) {              // ← 新增 finished 检查
        if (!statusCode) {                               // ← 新增 statusCode 检查
          return await proxyRequest(req, socket, parsedUrl, head)
        }
        return socket.end()
      }
      ```
      
      修复核心：
      - **`finished`**：仅当路由解析完成时才允许代理
      - **`statusCode`**：仅当无错误状态码时才代理，否则关闭 socket
      
      ---
      
      ### 攻击原理
      
      正常 HTTP 请求路径有完整的 IP 过滤/内网校验，但 **WebSocket Upgrade 分支缺少同样的安全校验**。绕过的关键在于：
      
      1. HTTP 协议允许请求行中使用**绝对 URL**（`absolute-form`，RFC 7230 §5.3.2）
      2. Next.js 的 HTTP 解析器不会拒绝带绝对 URL 的 Upgrade 请求
      3. Upgrade 分支直接信任 `parsedUrl` 中的目标地址
      
      ---
      
