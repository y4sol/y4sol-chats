   450|          
   451|          Summary of CVE-2026-44578:
   452|          
   453|          **Vulnerability**: SSRF via WebSocket Upgrade Requests
   454|          
   455|          **Root Cause**: In `packages/next/src/server/lib/router-server.ts`, the WebSocket upgrade handler destructured only `{ matchedOutput, parsedUrl }` from `resolveRoutes()`, ignoring `finished` and `statusCode`. When a WebSocket upgrade request with an **absolute URL** (e.g., `GET http://127.0.0.1:8080/secret HTTP/1.1` with `Upgrade: websocket` header) was sent to the Next.js server:
   456|          
   457|          1. `resolveRoutes()` would parse the absolute URL
   458|          2. `parsedUrl.protocol` would be truthy (it's "http:")
   459|          3. The code would blindly call `proxyRequest(req, socket, parsedUrl, head)` — proxying the request to any arbitrary URL
   460|          
   461|          This bypassed the normal HTTP request path's safety checks because:
   462|          - `finished` (whether route resolution completed normally) was never checked
   463|          - `statusCode` (which would be set to a redirect/error if the route was invalid) was never checked
   464|          - The proxy logic only existed in the WS upgrade handler
   465|          
   466|          **Fix**: 
   467|          1. Destructure `finished` and `statusCode` from `resolveRoutes()` result
   468|          2. Only proxy when `finished === true`
   469|          3. Only proxy when `statusCode` is falsy (no error/redirect response)
   470|          4. If conditions aren't met, close the socket with `socket.end()`
   471|          
   472|          **Attack vector**: An attacker sends an HTTP request with:
   473|          - Absolute URL in the request line: `GET http://<target>/path HTTP/1.1`
   474|          - `Upgrade: websocket` header (or `Connection: Upgrade`)
   475|          - Valid WebSocket headers (`Sec-WebSocket-Version`, `Sec-WebSocket-Key`)
   476|          
   477|          The server would then proxy the request to the attacker-specified target, enabling:
   478|          - Internal network scanning
   479|          - Cloud metadata service access (169.254.169.254)
   480|          - Local service access (127.0.0.1)
   481|          - Reading sensitive files via internal services
   482|          
