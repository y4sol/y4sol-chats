          - `finished` (whether route resolution completed normally) was never checked
          - `statusCode` (which would be set to a redirect/error if the route was invalid) was never checked
          - The proxy logic only existed in the WS upgrade handler
          
          **Fix**: 
          1. Destructure `finished` and `statusCode` from `resolveRoutes()` result
          2. Only proxy when `finished === true`
          3. Only proxy when `statusCode` is falsy (no error/redirect response)
          4. If conditions aren't met, close the socket with `socket.end()`
          
          **Attack vector**: An attacker sends an HTTP request with:
          - Absolute URL in the request line: `GET http://<target>/path HTTP/1.1`
          - `Upgrade: websocket` header (or `Connection: Upgrade`)
          - Valid WebSocket headers (`Sec-WebSocket-Version`, `Sec-WebSocket-Key`)
          
          The server would then proxy the request to the attacker-specified target, enabling:
          - Internal network scanning
          - Cloud metadata service access (169.254.169.254)
          - Local service access (127.0.0.1)
          - Reading sensitive files via internal services
          
