          **Vulnerability**: SSRF via WebSocket Upgrade Requests
          
          **Root Cause**: In `packages/next/src/server/lib/router-server.ts`, the WebSocket upgrade handler destructured only `{ matchedOutput, parsedUrl }` from `resolveRoutes()`, ignoring `finished` and `statusCode`. When a WebSocket upgrade request with an **absolute URL** (e.g., `GET http://127.0.0.1:8080/secret HTTP/1.1` with `Upgrade: websocket` header) was sent to the Next.js server:
          
