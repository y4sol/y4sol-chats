      ## CVE-2026-44578 — Next.js 服务器端请求伪造漏洞（SSRF）完整分析
      
      ---
      
      ### 基本信息
      
      | 项目 | 内容 |
      |------|------|
      | **CVE** | CVE-2026-44578 |
      | **GHSA** | GHSA-c4j6-fc7j-m34r |
      | **类型** | 服务端请求伪造 (CWE-918, SSRF) |
      | **严重性** | 高危 |
