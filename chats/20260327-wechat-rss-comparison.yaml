        │   ├── article_fetcher.py    # 批量并发获取文章\n│   └── webhook.py        # Webhook\
        \ 通知\n└── static/               # 前端页面（含 RSS 管理）\n```\n\n---\n\n## 内容类型与获取策略\n\
        \n本项目支持多种微信公众号内容类型，包括标准富文本、纯图片文章、图文消息、短内容、音频文章等。\n\n详细说明请查看：**[CONTENT_TYPES.md](CONTENT_TYPES.md)**\n\
