        center\">\r\n  <a href=\"https://github.com/DIYgod/sponsors\">\r\n    <img\
        \ src=\"https://raw.githubusercontent.com/DIYgod/sponsors/main/sponsors.wide.svg\"\
        \ />\r\n  </a>\r\n</p>\r\n\r\n## 功能特性\r\n\r\n- 微信公众号内容抓取和解析\r\n- RSS订阅生成\r\
        \n- 用户友好的Web管理界面\r\n- 定时自动更新内容\r\n- 支持多种数据库（默认SQLite，可选MySQL）\r\n- 支持多种抓取方式\r\
        \n- 支持多种RSS客户端\r\n- 支持授权过期提醒\r\n- 支持自定义通知渠道\r\n- 支持自定义RSS标题、描述、封面\r\n- 支持自定义RSS分页大小\r\
        \n- 支持导出md/docx/pdf/json格式\r\n- 支持API接口调用/WebHook调用\r\n\r\n\r\n# ❤️ 赞助\r\n\
        如果觉得 We-MP-RSS 对你有帮助，欢迎给我来一杯啤酒！<br/>\r\n<img src=\"docs/赞赏码.jpg\" width=180/>\r\
        \n[Paypal](https://www.paypal.com/ncp/payment/PUA72WYLAV5KW)\r\n\r\n## 界面截图\r\
        \n- 登录界面  \r\n<img src=\"docs/登录.png\" alt=\"登录\" width=\"80%\"/><br/>\r\n\
        - 主界面  \r\n<img src=\"docs/主界面.png\" alt=\"主界面\" width=\"80%\"/><br/>\r\n\
        - 扫码授权  \r\n<img src=\"docs/扫码授权.png\" alt=\"扫码授权\" width=\"80%\"/><br/>\r\
        \n- 添加订阅  \r\n<img src=\"docs/添加订阅.png\" alt=\"添加订阅\" width=\"80%\"/><br/>\r\
        \n\r\n- 客户端应用<br/>\r\n<img src=\"docs/folo.webp\" alt=\"FOLO客户端应用\" width=\"\
        80%\"/><br/>\r\n\r\n\r\n\r\n## 系统架构\r\n\r\n项目采用前后端分离架构：\r\n- 后端：Python + FastAPI\r\
        \n- 前端：Vue 3 + Vite\r\n- 数据库：SQLite (默认)/MySQL\r\n<img src=\"docs/架构原理.png\"\
        \ alt=\"架构原理\" width=\"80%\"/>\r\n\r\n更多项目原理，请参考[项目文档](https://deepwiki.com/rachelos/we-mp-rss/3.5-notification-system)。\r\
        \n\r\n## 安装指南\r\n\r\n# 二次开发\r\n## 环境需求\r\n- Python>=3.13.1\r\n- Node>=20.18.3\r\
        \n### 后端服务\r\n\r\n1. 克隆项目\r\n```bash\r\ngit clone https://github.com/rachelos/we-mp-rss.git\r\
        \ncd we-mp-rss\r\n```\r\n\r\n2. 安装Python依赖\r\n```bash\r\npip install -r requirements.txt\r\
        \n```\r\n\r\n3. 配置数据库\r\n复制并修改配置文件：\r\n```bash\r\ncp config.example.yaml config.yaml\r\
        \ncopy config.example.yaml config.yaml\r\n```\r\n3. 启动服务\r\n```bash\r\npython\
        \ main.py -job True -init True\r\n```\r\n\r\n## 前端开发\r\n1. 安装前端依赖\r\n```bash\r\
        \ncd we-mp-rss/web_ui\r\nyarn install\r\n```\r\n\r\n2. 启动前端服务\r\n```bash\r\
        \nyarn dev\r\n```\r\n3. 访问前端页面\r\n```\r\nhttp://localhost:3000\r\n```\r\n\r\
        \n# 环境变量配置\r\n\r\n以下是 `config.yaml` 中支持的环境变量配置：\r\n\r\n| 环境变量 | 默认值 | 描述 |\r\
        \n|----------|--------|------|\r\n| `APP_NAME` | `we-mp-rss` | 应用名称 |\r\n\
        | `SERVER_NAME` | `we-mp-rss` | 服务名称 |\r\n| `WEB_NAME` | `WeRSS微信公众号订阅助手`\
