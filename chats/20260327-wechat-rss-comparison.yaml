  content: '## 📊 微信公众号 RSS 项目对比


    ### 项目概况


    | 属性 | **wechat-download-api** | **we-mp-rss (WeRSS)** |

    |------|------------------------|----------------------|

    | **Stars** | 389 ⭐ | **2,620 ⭐** |

    | **Forks** | 24 | **455** |

    | **语言** | Python | Python + Vue |

    | **许可证** | AGPL 3.0 | MIT |

    | **规模** | 小型 (~800KB) | 大型 (~192MB) |


    ---


    ### 功能对比


    | 功能 | wechat-download-api | we-mp-rss |

    |------|-------------------|-----------|

    | **RSS 订阅** | ✅ 支持 | ✅ 支持 |

    | **文章内容获取** | ✅ | ✅ |

    | **公众号搜索** | ✅ | ✅ |

    | **微信扫码登录** | ✅ | ✅ |

    | **Markdown 导出** | ❌ | ✅ |

    | **PDF 导出** | ❌ | ✅ |

    | **图片代理** | ✅ | ✅ |

    | **Webhook 通知** | ✅ (企业微信) | ✅ (钉钉/飞书/微信) |

    | **多数据库** | SQLite | SQLite + **MySQL** |

    | **AI Agent 接入** | ❌ | ✅ |

    | **Access Key 认证** | ❌ | ✅ |

    | **多公众号管理** | ❌ (需多实例) | ✅ |

    | **标签订阅** | ❌ | ✅ |

    | **分页/过滤** | 基础 | 高级规则 |


    ---


    ### 技术架构对比


    ```

    ┌─────────────────────────────────────────────────────────────────────────┐

    │                    wechat-download-api (轻量级)                          │

    ├─────────────────────────────────────────────────────────────────────────┤

    │                                                                         │

    │   Python + FastAPI                                                      │

    │   ├── routes/ (article, rss, search, login)                           │

    │   └── utils/ (http_client, proxy_pool, rate_limiter)                   │

    │                                                                         │

    │   单一 SQLite 数据库                                                    │

    │   ├── 反风控: curl_cffi TLS 指纹 + SOCKS5 代理池                       │

    │   └── 认证: 扫码登录 → .env 保存 Token/Cookie                          │

    │                                                                         │

    │   ⚡ 轻量、简单、快速部署                                                │

    └─────────────────────────────────────────────────────────────────────────┘


    ┌─────────────────────────────────────────────────────────────────────────┐

    │                    we-mp-rss / WeRSS (企业级)                          │

    ├─────────────────────────────────────────────────────────────────────────┤

    │                                                                         │

    │   Python (FastAPI) + Vue 3 (前后端分离)                                │

    │                                                                         │

    │   ├── core/ (核心逻辑: auth, rss, article, cascade, notice)           │

    │   ├── apis/ (REST API: 20+ 端点)                                      │

    │   ├── web_ui/ (Vue 3 管理界面)                                         │

    │   ├── doc2pdf/ (PDF 导出)                                              │

    │   ├── jobs/ (定时任务)                                                  │

    │   └── driver/ (浏览器驱动)                                              │

    │                                                                         │

    │   双数据库: SQLite (默认) / MySQL (生产)                               │

    │   ├── 反风控: 多 cascade 账号 + 浏览器指纹                             │

    │   ├── 认证: AK-SK Access Key + 扫码登录                                 │

    │   └── 通知: 多渠道 Webhook                                              │

    │                                                                         │

    │   🏢 功能丰富、扩展性强、适合生产环境                                    │

    └─────────────────────────────────────────────────────────────────────────┘

    ```


    ---


    ### 反风控对比


    | 方案 | wechat-download-api | we-mp-rss |

    |------|-------------------|-----------|

    | **TLS 指纹** | curl_cffi (Chrome) | 浏览器驱动 (Firefox) |

    | **代理池** | SOCKS5 代理池 (自建) | Cascade 多账号轮换 |

    | **限频** | 三层限频器 | 定时任务间隔控制 |

    | **账号策略** | 单账号 | 多 cascade 账号池 |


    ---


    ### 部署复杂度


    | 方面 | wechat-download-api | we-mp-rss |

    |------|-------------------|-----------|

    | **Docker 部署** | ⭐ 一行命令 | ⭐ 一行命令 |

    | **配置难度** | 低 | 中 |

    | **依赖** | 少 | 多 (Python 3.13+, Node 20+) |

    | **资源消耗** | 低 (~100MB) | 高 (~1GB) |


    ---


    ### 适用场景


    | 场景 | 推荐 |

    |------|------|

    | 个人使用、快速原型 | **wechat-download-api** |

    | 多公众号管理、生产环境 | **we-mp-rss** |

    | Markdown/PDF 导出需求 | **we-mp-rss** |

    | AI Agent 集成 | **we-mp-rss** |

    | 轻量级 API 服务 | **wechat-download-api** |

    | 已有 RSS 阅读器 (Feedly 等) | 两者皆可 |


    ---


    ### 🏆 总结


    | 项目 | 优势 | 劣势 |

    |------|------|------|

    | **wechat-download-api** | 轻量、AGPL 开源、反风控强 (SOCKS5) | 功能单一、无前端、无多账号 |

    | **we-mp-rss** | 功能丰富、前端友好、社区活跃 (2.6k ⭐) | 复杂、许可不明确、资源占用高 |


    **推荐**：

    - 简单需求 → `wechat-download-api`

    - 生产环境 → `we-mp-rss`'
